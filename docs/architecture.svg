<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">econ-lakehouse system architecture</title>
  <desc id="desc">TCMB EVDS data flows through Bronze, Silver, and Gold layers into FastAPI and Streamlit, coordinated by Dagster and governed by GitHub Actions and a three-calendar-month freshness policy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#102b46"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d69452"/><stop offset="1" stop-color="#8f4f22"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe7ee"/><stop offset="1" stop-color="#7e94a8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd86a"/><stop offset="1" stop-color="#c28c00"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#63d6ff"/></marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,sans-serif;fill:#f3f8fc}.subtitle{font:400 19px Inter,Segoe UI,sans-serif;fill:#a8bfd2}.label{font:700 23px Inter,Segoe UI,sans-serif;fill:#fff}.small{font:400 16px Inter,Segoe UI,sans-serif;fill:#e9f2f8}.dark{fill:#102030}.pill{font:700 15px Inter,Segoe UI,sans-serif;fill:#9ee7ff}.control{fill:#132f49;stroke:#3b7297;stroke-width:2}.flow{stroke:#63d6ff;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1460" cy="90" r="210" fill="#1d6682" opacity=".18"/><circle cx="110" cy="850" r="260" fill="#225378" opacity=".16"/>
  <text x="80" y="82" class="title">econ-lakehouse</text>
  <text x="80" y="116" class="subtitle">Reproducible Turkish macroeconomic data platform · medallion architecture · explicit freshness controls</text>

  <g filter="url(#shadow)">
    <rect x="70" y="245" width="230" height="190" rx="24" fill="#164a68" stroke="#4ac7ef" stroke-width="2"/>
    <text x="185" y="300" text-anchor="middle" class="label">TCMB EVDS</text>
    <text x="185" y="335" text-anchor="middle" class="small">Configured macro series</text>
    <text x="185" y="365" text-anchor="middle" class="small">HTTP ingestion</text>
    <rect x="112" y="390" width="146" height="29" rx="14" fill="#0b263b"/>
    <text x="185" y="410" text-anchor="middle" class="pill">SOURCE + PROVENANCE</text>

    <rect x="390" y="245" width="230" height="190" rx="24" fill="url(#bronze)"/>
    <text x="505" y="300" text-anchor="middle" class="label">BRONZE</text>
    <text x="505" y="335" text-anchor="middle" class="small">Raw observations</text>
    <text x="505" y="365" text-anchor="middle" class="small">Immutable source shape</text>
    <rect x="445" y="390" width="120" height="29" rx="14" fill="#603018" opacity=".85"/>
    <text x="505" y="410" text-anchor="middle" class="pill">INGEST</text>

    <rect x="710" y="245" width="230" height="190" rx="24" fill="url(#silver)"/>
    <text x="825" y="300" text-anchor="middle" class="label dark">SILVER</text>
    <text x="825" y="335" text-anchor="middle" class="small dark">Typed and standardized</text>
    <text x="825" y="365" text-anchor="middle" class="small dark">Validated dbt models</text>
    <rect x="765" y="390" width="120" height="29" rx="14" fill="#425668"/>
    <text x="825" y="410" text-anchor="middle" class="pill">CLEAN</text>

    <rect x="1030" y="245" width="230" height="190" rx="24" fill="url(#gold)"/>
    <text x="1145" y="300" text-anchor="middle" class="label dark">GOLD</text>
    <text x="1145" y="335" text-anchor="middle" class="small dark">Analytics-ready facts</text>
    <text x="1145" y="365" text-anchor="middle" class="small dark">Curated marts</text>
    <rect x="1085" y="390" width="120" height="29" rx="14" fill="#765800"/>
    <text x="1145" y="410" text-anchor="middle" class="pill">SERVE</text>

    <rect x="1350" y="190" width="180" height="112" rx="22" fill="#513a86" stroke="#9d82f1" stroke-width="2"/>
    <text x="1440" y="238" text-anchor="middle" class="label">FastAPI</text>
    <text x="1440" y="270" text-anchor="middle" class="small">Data API</text>
    <rect x="1350" y="350" width="180" height="112" rx="22" fill="#8e3054" stroke="#f47da6" stroke-width="2"/>
    <text x="1440" y="398" text-anchor="middle" class="label">Streamlit</text>
    <text x="1440" y="430" text-anchor="middle" class="small">Dashboard</text>
  </g>

  <path class="flow" d="M300 340 H377"/><path class="flow" d="M620 340 H697"/><path class="flow" d="M940 340 H1017"/>
  <path class="flow" d="M1260 320 C1310 320 1305 246 1337 246"/><path class="flow" d="M1260 360 C1310 360 1305 406 1337 406"/>

  <g filter="url(#shadow)">
    <rect x="160" y="585" width="390" height="190" rx="24" class="control"/>
    <text x="195" y="635" class="label">Dagster orchestration</text>
    <text x="195" y="673" class="small">Coordinates ingestion and transformation</text>
    <text x="195" y="705" class="small">Makes pipeline steps observable and repeatable</text>
    <rect x="195" y="730" width="162" height="29" rx="14" fill="#0b263b"/>
    <text x="276" y="750" text-anchor="middle" class="pill">EXECUTION PLANE</text>

    <rect x="605" y="585" width="390" height="190" rx="24" class="control"/>
    <text x="640" y="635" class="label">Freshness contract</text>
    <text x="640" y="673" class="small">Maximum lag: 3 calendar months</text>
    <text x="640" y="705" class="small">Shared policy across gate, tests, and dashboard</text>
    <rect x="640" y="730" width="190" height="29" rx="14" fill="#0b263b"/>
    <text x="735" y="750" text-anchor="middle" class="pill">QUALITY CONTROL</text>

    <rect x="1050" y="585" width="390" height="190" rx="24" class="control"/>
    <text x="1085" y="635" class="label">GitHub Actions</text>
    <text x="1085" y="673" class="small">Deterministic CI on PR and main</text>
    <text x="1085" y="705" class="small">Scheduled or manual live freshness gate</text>
    <rect x="1085" y="730" width="176" height="29" rx="14" fill="#0b263b"/>
    <text x="1173" y="750" text-anchor="middle" class="pill">GOVERNANCE PLANE</text>
  </g>

  <path d="M355 585 C355 510 505 505 505 448" stroke="#4f99bf" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <path d="M800 585 C800 515 825 505 825 448" stroke="#4f99bf" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <path d="M1245 585 C1245 515 1145 505 1145 448" stroke="#4f99bf" stroke-width="3" stroke-dasharray="8 8" fill="none"/>

  <text x="80" y="850" class="subtitle">Evidence boundary · repository architecture at merge commit cee7161 · deployment identity and workflow execution require separate verification</text>
</svg>
