name: log forensics

# #63, #68 and #70 are three separate intermittent failures, and all three are
# blocked on the same missing fact: what the failing step actually printed.
# Each issue says the log "could not be obtained from this environment".
#
# The runner is in that environment. `gh run view --log-failed` returns the
# output of exactly the steps that failed, so this workflow retrieves it for
# the specific runs those issues name and republishes it in two places:
# an artifact, and error annotations that are readable through the API.
#
# The window is cut around the error marker rather than around the end of the
# file, because the end of any runner log is the post-job git teardown and
# says nothing about the failure.
#
# It only reads. Nothing here re-runs a pipeline, and nothing here decides
# whether a flake is fixed.

on:
  push:
    branches:
      - "ops/**"
    paths:
      - ".github/workflows/log-forensics.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: "Space-separated run ids to retrieve failed step logs for"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # 33964738277: #63, pipeline / dashboard-smoke step 7, 2026-09-05
      # 33982259880: #68, run-audit step 10, 2026-09-05
      # 34027310847: #70, run-audit step 9 on main, 2026-09-06
      DEFAULT_RUNS: "33964738277 33982259880 34027310847"
    steps:
      - name: Retrieve the failed steps
        shell: bash
        run: |
          set -uo pipefail
          runs="${{ inputs.runs }}"
          if [ -z "${runs}" ]; then runs="${DEFAULT_RUNS}"; fi
          mkdir -p forensics
          for run in ${runs}; do
            gh run view "${run}" --repo "${GITHUB_REPOSITORY}" --log-failed \
              > "forensics/${run}.failed.log" 2> "forensics/${run}.failed.err" \
              || echo "failed-step log unavailable for ${run}: $(cat "forensics/${run}.failed.err")"
            sed -E 's/[A-Za-z0-9_-]{32,}/[REDACTED-LONG-TOKEN]/g' \
              "forensics/${run}.failed.log" > "forensics/${run}.redacted.log"
          done

          python3 - ${runs} <<'PY'
          import re
          import sys
          from pathlib import Path

          # Runner logs prefix every line with "job\tstep\ttimestamp ". Strip that
          # so the annotation carries program output rather than bookkeeping.
          PREFIX = re.compile(r"^[^\t]*\t[^\t]*\t\S+Z ")
          MARKERS = ("##[error]", "Traceback (most recent call last)", "AssertionError",
                     "Error:", "FAILED", "Exception")

          for run in sys.argv[1:]:
              path = Path(f"forensics/{run}.redacted.log")
              raw = path.read_text(encoding="utf-8", errors="replace").splitlines()
              lines = [PREFIX.sub("", line).rstrip() for line in raw]
              lines = [line for line in lines if line.strip()]

              hits = [i for i, line in enumerate(lines) if any(m in line for m in MARKERS)]
              print(f"::group::run {run}: {len(lines)} non-empty lines, {len(hits)} marker lines")
              if hits:
                  start = max(0, hits[0] - 45)
                  end = min(len(lines), hits[-1] + 6)
                  window = lines[start:end]
              else:
                  window = lines[-80:]
              for line in window:
                  print(line)
              print("::endgroup::")

              excerpt = " ~ ".join(window)[-1700:]
              title = f"failure site {run}" if hits else f"no error marker in {run}"
              print(f"::error title={title}::{excerpt}")

              summary = Path(f"forensics/{run}.window.txt")
              summary.write_text("\n".join(window), encoding="utf-8")
          PY

      - name: Preserve the retrieved logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-forensics
          path: forensics/
          if-no-files-found: error
          retention-days: 30
