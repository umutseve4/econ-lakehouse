name: one-shot-patch-kok-readme

# TEK SEFERLIK. Kok README.md buyuk bir dosya; elle yeniden yazmak bayt
# duzeyinde bozulma riski tasiyor. Bunun yerine capasi tam bir kez eslesen
# bir yama betigi calistirip sonucu commit ediyoruz. Eklenecek metin
# .github/one-shot/denetim-001-blok.md icinde. Yama basildiktan sonra bu
# uc dosya da ayni pull request icinde silinir.

on:
  push:
    branches: [denetim-001-kok-readme]
    paths:
      - ".github/workflows/one-shot-patch-kok-readme.yml"
      - ".github/one-shot/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yamala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README'yi yamala
        run: python .github/one-shot/patch_kok_readme.py

      - name: Sonucu dogrula
        run: |
          grep -q "Audit 001: is the Turkish CPI gap an arithmetic error" README.md
          test "$(grep -c '## Run the whole thing in four commands' README.md)" = "1"
          echo "capa korundu, bolum eklendi"

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README degismedi, push edilecek bir sey yok"
            exit 0
          fi
          git add README.md
          git commit -m "Kok README: Denetim 001 bolumu (CI yamasi, elle yazilmadi)"
          git push
