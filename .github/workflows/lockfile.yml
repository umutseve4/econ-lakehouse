name: lockfile

# Issue #61. The dependency intent lives in `requirements.in` as bounded
# ranges. This workflow resolves those ranges exactly once, on the runner
# image and Python version every other job uses, and writes the result to
# `requirements.txt`.
#
# `requirements.txt` is generated. Every install path in this repository
# already reads it, so pinning that file is what makes each job install the
# same set of code rather than whatever was newest when it happened to run.
# To change a dependency, edit `requirements.in` and let this workflow
# rewrite the resolved set.

on:
  push:
    branches:
      - "ops/**"
    paths:
      - "requirements.in"
      - ".github/workflows/lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve requirements.in to an exact set
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools
          pip-compile --output-file=resolved.txt --strip-extras --no-header requirements.in
          {
            echo "# Generated from requirements.in by .github/workflows/lockfile.yml."
            echo "# Do not hand-edit. Edit requirements.in and re-run that workflow."
            echo "# python: $(python -c 'import platform; print(platform.python_version())')"
            echo "# resolved-at-utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# source-commit: ${GITHUB_SHA}"
            echo
            cat resolved.txt
          } > requirements.txt
          rm -f resolved.txt
          echo "--- resolved set ---"
          cat requirements.txt

      # A resolved set that has never been installed is still only a claim.
      # Install it into a clean environment and assert that what pip actually
      # ended up with matches what the file names, package by package. This
      # step gates the workflow: a set that does not install, or that installs
      # something other than what it names, is not committed.
      - name: The resolved set must install, and install exactly what it names
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/python -m pip install --upgrade pip >/dev/null
          /tmp/lockcheck/bin/python -m pip install -r requirements.txt
          /tmp/lockcheck/bin/python -m pip freeze --all > /tmp/frozen.txt
          python - <<'PY'
          import re
          import sys

          def parse(path):
              out = {}
              for raw in open(path, encoding="utf-8"):
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith("-"):
                      continue
                  m = re.match(r"^([A-Za-z0-9._-]+)==([^\s;]+)", line)
                  if m:
                      out[m.group(1).lower().replace("_", "-")] = m.group(2)
              return out

          locked = parse("requirements.txt")
          frozen = parse("/tmp/frozen.txt")
          assert locked, "the resolved file names no pinned packages"

          missing = sorted(k for k in locked if k not in frozen)
          mismatched = sorted(
              f"{k}: pinned={locked[k]} installed={frozen[k]}"
              for k in locked
              if k in frozen and frozen[k] != locked[k]
          )
          extra = sorted(
              k for k in frozen
              if k not in locked and k not in {"pip", "setuptools", "wheel"}
          )

          print(f"pinned packages: {len(locked)}")
          print(f"installed packages: {len(frozen)}")
          if missing:
              print(f"::error title=resolution incomplete::not installed: {missing}")
          if mismatched:
              print(f"::error title=resolution not honoured::{mismatched}")
          if extra:
              print(f"::error title=resolution underspecified::installed but unpinned: {extra}")
          if missing or mismatched or extra:
              sys.exit(1)
          print("the environment matches the resolved set exactly: OK")
          PY

      # Stage first. An earlier revision diffed the working tree against HEAD,
      # which reports no change for a file git has never tracked, so the very
      # first resolution was verified and then thrown away.
      - name: Commit the resolved set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements.txt
          if git diff --cached --quiet -- requirements.txt; then
            echo "requirements.txt is already the current resolution; nothing to commit"
            exit 0
          fi
          git commit -m "ops: regenerate requirements.txt from a resolver run"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed $(git rev-parse HEAD)"

      - name: Upload the resolved set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-stack
          path: requirements.txt
          if-no-files-found: error
          retention-days: 30
