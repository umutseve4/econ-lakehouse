name: lockfile

# Issue #61. `requirements.txt` states floors only, so the set of code CI
# executes is a function of when the job ran. This workflow resolves that
# input exactly once, on the runner image and Python version every other
# job uses, and commits the resolved set as `requirements.lock`.
#
# The lock is never hand-edited. It is regenerated by re-running this
# workflow, so the file stays a record of a resolver run rather than a
# claim about one.

on:
  push:
    branches:
      - "ops/**"
    paths:
      - "requirements.txt"
      - ".github/workflows/lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve requirements.txt to an exact set
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools
          pip-compile --output-file=requirements.lock --strip-extras --no-header requirements.txt
          {
            echo "# Generated by .github/workflows/lockfile.yml. Do not hand-edit."
            echo "# Re-run that workflow to regenerate."
            echo "# python: $(python -c 'import platform; print(platform.python_version())')"
            echo "# resolved-at-utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# source-commit: ${GITHUB_SHA}"
            echo
            cat requirements.lock
          } > requirements.lock.new
          mv requirements.lock.new requirements.lock
          echo "--- resolved set ---"
          cat requirements.lock

      # A lock that has never been installed is still only a claim. Install it
      # into a clean environment and assert that what pip actually ended up
      # with matches what the lock names, package by package. This step gates
      # the workflow: a lock that does not install, or that installs something
      # other than what it names, is not committed.
      - name: The lock must install, and install exactly what it names
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/python -m pip install --upgrade pip >/dev/null
          /tmp/lockcheck/bin/python -m pip install -r requirements.lock
          /tmp/lockcheck/bin/python -m pip freeze --all > /tmp/frozen.txt
          python - <<'PY'
          import re
          import sys

          def parse(path):
              out = {}
              for raw in open(path, encoding="utf-8"):
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith("-"):
                      continue
                  m = re.match(r"^([A-Za-z0-9._-]+)==([^\s;]+)", line)
                  if m:
                      out[m.group(1).lower().replace("_", "-")] = m.group(2)
              return out

          locked = parse("requirements.lock")
          frozen = parse("/tmp/frozen.txt")
          assert locked, "the lock file names no pinned packages"

          missing = sorted(k for k in locked if k not in frozen)
          mismatched = sorted(
              f"{k}: lock={locked[k]} installed={frozen[k]}"
              for k in locked
              if k in frozen and frozen[k] != locked[k]
          )
          extra = sorted(
              k for k in frozen
              if k not in locked and k not in {"pip", "setuptools", "wheel"}
          )

          print(f"locked packages: {len(locked)}")
          print(f"installed packages: {len(frozen)}")
          if missing:
              print(f"::error title=lock incomplete::not installed: {missing}")
          if mismatched:
              print(f"::error title=lock not honoured::{mismatched}")
          if extra:
              print(f"::error title=lock underspecified::installed but unlocked: {extra}")
          if missing or mismatched or extra:
              sys.exit(1)
          print("the environment matches the lock exactly: OK")
          PY

      # Stage first. The previous revision diffed the working tree against
      # HEAD, which reports no change for a file that git has never tracked,
      # so the very first resolution was verified and then thrown away.
      - name: Commit the resolved set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements.lock
          if git diff --cached --quiet -- requirements.lock; then
            echo "requirements.lock is already the current resolution; nothing to commit"
            exit 0
          fi
          git commit -m "ops: regenerate requirements.lock from a resolver run"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed $(git rev-parse HEAD)"

      - name: Upload the resolved set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-stack
          path: requirements.lock
          if-no-files-found: error
          retention-days: 30
