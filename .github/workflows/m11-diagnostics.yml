name: m11-diagnostics

# TEMPORARY — delete before merging PR #12.
# Answers two questions with live EVDS data, in one run:
#   1. Can TP.TUFE1YI.T1 replace the frozen TP.FG.J0 without changing what
#      the mart measures? (pairwise YoY comparison — already answered: no)
#   2. Is ANY candidate CPI series both live and YoY-compatible with
#      TP.FG.J0, and can we read series metadata from the EVDS catalog?

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  series-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare candidate CPI series (live)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        continue-on-error: true
        run: |
          python ingest/evds_series_compare.py 2>&1 | tee /tmp/compare.txt

      - name: Sweep candidate series and probe catalog (live)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        continue-on-error: true
        run: |
          python ingest/evds_candidate_sweep.py 2>&1 | tee /tmp/sweep.txt

      - name: Publish diagnostics onto the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 25000); }
              catch (e) { return '(no output captured)'; }
            };
            const body = [
              '## M11 series diagnostics (automated)',
              '### Pairwise comparison',
              '```', read('/tmp/compare.txt'), '```',
              '### Candidate sweep + catalog probe',
              '```', read('/tmp/sweep.txt'), '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
