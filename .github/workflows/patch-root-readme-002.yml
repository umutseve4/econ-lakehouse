name: patch-root-readme-002

# Tek seferlik yama. Kok README.md'ye Audit 002 bolumunu ekler.
# Dosya baglamdan yeniden yazilmaz; depo kendi dosyasini okur, capayi
# tam bir kez esler, yazar ve bu is akisini siler.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-root-readme-002.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Yamayi uygula
        run: |
          python3 - <<'PY'
          import io, sys
          yol = "README.md"
          with io.open(yol, encoding="utf-8") as f:
              metin = f.read()

          capa = "The guard was proved by a real break, not by a claim.\n\n---\n\n## Run the whole thing in four commands\n"

          bolum = """The guard was proved by a real break, not by a claim.

---

## Audit 002: can the weights alone produce the gap?

Audit 001 named the basket as the source of the gap but did not measure it.
Audit 002 was the attempt to measure it, and it **stopped, because my own
pre-registered hypothesis turned out to be wrong**.

The pre-registered Layer A identity was that the published headline equals the
weighted mean of the 13 main-group annual rates. It does not hold for August
2026:

| quantity | value |
|---|---:|
| computed annual rate | 31.278154% |
| published annual rate | 31.51% |
| residual | -0.231846 points |
| rounding envelope half-width | 0.015163 points |
| residual / envelope half-width | **15.29x** |

The published headline sits outside the envelope even when the envelope is
built in the most generous way available, so rounding cannot explain it.

**This is not a TUIK error.** TUIK's own 13 published annual contributions sum
to exactly 31.51 with a residual of 0.000000, so the data is internally
consistent and correctly transcribed. What broke is the aggregation model
**I** wrote into the protocol: the annual headline is not a simple weighted
mean of current-year weights.

Pre-registered stopping rule 1 fired, so Layer B and Layer C were never
computed and never published. That constraint is enforced by code rather than
asserted in prose: the functions `katman_b` and `katman_c` do not exist in
`audit.py`, and both a test and a CI `grep` step turn red if they reappear. The
pre-registered question was left unanswered and **was not rewritten** after the
result was seen.

```bash
python audits/002-agirlik-siniri/audit.py --json --check
```

- **[Read the audit](audits/002-agirlik-siniri/README.md)** (in Turkish)
- [Pre-registered protocol](audits/002-agirlik-siniri/PROTOCOL.md), commit
  `4b1e27f`, committed alone before any data was fetched
- [Sources](audits/002-agirlik-siniri/data/SOURCES.md), one code per data cell,
  with the full-table dependence on a secondary source stated as a limitation

The report-versus-data guard was again proved by a real break rather than a
claim: a deliberately wrong number was published to the report, CI failed at
commit `2f01c40` on exactly that step with the following steps skipped, and the
correction passed at `bffd2f5`.

---

## Run the whole thing in four commands
"""

          vurus = metin.count(capa)
          if vurus != 1:
              print("::error title=Yama cengeli::capa %d kez eslesti, 1 bekleniyordu" % vurus)
              sys.exit(1)

          if "Audit 002" in metin:
              print("::error title=Yama cengeli::bolum zaten var")
              sys.exit(1)

          metin = metin.replace(capa, bolum)
          with io.open(yol, "w", encoding="utf-8", newline="") as f:
              f.write(metin)
          print("yama uygulandi")
          PY

      - name: Fark
        run: |
          git --no-pager diff --stat

      - name: Tek seferlik dosyayi sil
        run: |
          rm .github/workflows/patch-root-readme-002.yml

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282\u002Bgithub-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "kok README: Audit 002 bolumu"
          git push origin main
