name: patch-002-kanit-zinciri

# Tek seferlik yama. audits/002-agirlik-siniri/README.md icindeki kanit
# zinciri tablosuna, korumanin gercek bir kirmizi kosuyla kanitlandigini
# gosteren satiri ekler. Dosya baglamdan yeniden yazilmaz; depo kendi
# dosyasini okur, capayi tam bir kez esler ve sonucu yazar.

on:
  push:
    branches: ["denetim-002-sepet"]
    paths:
      - ".github/workflows/patch-002-kanit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: denetim-002-sepet

      - name: Yamayi uygula
        run: |
          python3 - <<'PY'
          import io, sys
          yol = "audits/002-agirlik-siniri/README.md"
          with io.open(yol, encoding="utf-8") as f:
              metin = f.read()

          capa = "| Kaynaklar h\u00fccre baz\u0131nda kodlanm\u0131\u015f | [`data/SOURCES.md`](data/SOURCES.md) |\n"
          yeni = capa + "| Rapor ile veri ayr\u0131\u015f\u0131rsa CI ger\u00e7ekten k\u0131rm\u0131z\u0131 oluyor | `2f01c40` FAILURE (yaln\u0131z ad\u0131m 8, ad\u0131m 9 ve 10 SKIPPED), `bffd2f5` SUCCESS |\n"

          vurus = metin.count(capa)
          if vurus != 1:
              print("::error title=Yama cengeli::capa %d kez eslesti, 1 bekleniyordu" % vurus)
              sys.exit(1)

          if "2f01c40" in metin:
              print("::error title=Yama cengeli::satir zaten var")
              sys.exit(1)

          metin = metin.replace(capa, yeni)
          with io.open(yol, "w", encoding="utf-8", newline="") as f:
              f.write(metin)
          print("yama uygulandi")
          PY

      - name: Fark
        run: |
          git --no-pager diff --stat
          git --no-pager diff

      - name: Denetim hala yesil mi
        run: |
          python3 audits/002-agirlik-siniri/audit.py --json --check

      - name: Tek seferlik dosyayi sil
        run: |
          rm .github/workflows/patch-002-kanit.yml

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "denetim 002: kanit zincirine gercek kirmizi/yesil CI satirini ekle"
          git push origin denetim-002-sepet
