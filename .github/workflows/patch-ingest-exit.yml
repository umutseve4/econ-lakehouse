name: one-shot patch (ingest exit path)

# Disposable. Runs tools/patch_ingest_exit.py, which changes two anchored
# regions of ingest/ingest.py and fails if either anchor does not match
# exactly once. Both this workflow and the script are deleted in the pull
# request that merges the fix.

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/patch-ingest-exit.yml"
      - "tools/patch_ingest_exit.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the anchored patch
        run: python tools/patch_ingest_exit.py

      - name: Prove the result parses and the old exit path is gone
        shell: bash
        run: |
          set -euo pipefail
          python -c "import ast, pathlib; ast.parse(pathlib.Path('ingest/ingest.py').read_text())"
          echo "syntax: ok"
          grep -n "os._exit(status)" ingest/ingest.py
          if grep -q "sys.exit(main())" ingest/ingest.py; then
            echo "old exit path still present"
            exit 1
          fi
          echo "old exit path: gone"

      - name: Commit the patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ingest/ingest.py
          if git diff --cached --quiet; then
            echo "nothing changed; refusing to report success on an empty patch"
            exit 1
          fi
          git commit -m "fix: leave the ingest CLI without running teardown (#63 #68 #70)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
