name: run-audit

on:
  # The README badge for this workflow shows the status of its most recent
  # run. Without a push trigger the most recent run is whatever PR happened
  # to touch these paths last, so a green badge could outlive a broken main.
  # See issue #50.
  push:
    branches: [main]
  pull_request:
    paths:
      - "observability/**"
      - "orchestrate.py"
      - "tests/test_run_log*.py"
      - "tests/test_orchestrate_cli.py"
      - ".github/workflows/run-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-audit-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a main commit's audit result is
  # not, because it is the thing the badge reports.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # This step used to end with a bare `pip install duckdb`. That install
      # was redundant -- requirements.txt already carries `duckdb>=1.5.5` --
      # and, being unconstrained, it was a second dependency resolution that
      # no other job in this repository performs: it can legally resolve a
      # duckdb newer than the one dbt-duckdb was resolved against, and the
      # combination is then exercised for the first time by `dbt build`.
      # The differential that motivated removing it: `docker-smoke` runs the
      # identical `python orchestrate.py --mode fixture` from requirements.txt
      # alone (see Dockerfile) and passes, while this job's equivalent step
      # fails. Removing the extra install makes the two environments the same
      # question. It is a candidate cause, not a proven one -- which is why
      # the two diagnostic steps below exist to answer it either way.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # requirements.txt pins floors, not exact versions, so "which duckdb
      # actually got installed?" is unanswerable after the fact unless the
      # answer was recorded while the job ran. Never gates CI.
      - name: Resolved data stack inventory (diagnostic, never gates CI)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m pip list 2>&1 \
            | grep -Ei '^(duckdb|dbt-core|dbt-duckdb|pandas|pyarrow|fsspec) ' \
            | tee artifacts/datastack.txt
          python -c "import duckdb; print('duckdb runtime:', duckdb.__version__)" \
            | tee -a artifacts/datastack.txt
          dbt --version 2>&1 | tee -a artifacts/datastack.txt || true

      - name: Unit tests — run log contract
        run: python tests/test_run_log.py

      - name: Unit tests — failure paths
        run: python tests/test_run_log_failure_paths.py

      - name: Concurrency proofs — lost update is real and is gone
        run: python tests/test_run_log_concurrency.py

      - name: Unit tests — the --mode flag actually decides the mode
        run: python tests/test_orchestrate_cli.py

      - name: Pipeline run (fixture mode)
        run: python orchestrate.py --mode fixture

      # Absence of evidence, one more time. When this job failed on main, the
      # orchestrator had *already* written `failed_step` to the ledger before
      # re-raising (orchestrate.py `_record_run` in the `except` branch), and
      # `Upload run audit evidence` uploaded that ledger with `if: always()`.
      # The answer was on disk the whole time. But `Print run history` only
      # ran on success, so on the one occasion the information was needed,
      # every step that could have shown it was skipped. Read the ledger on
      # failure, so a red badge states its own cause instead of requiring
      # somebody to open the raw log.
      - name: Explain the failure from the ledger
        if: failure()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, ".")
          print("===== BASARISIZLIK ACIKLAMASI =====")
          try:
              from observability.run_log import read_runs
          except BaseException as exc:  # noqa: BLE001 - diagnostics must not raise
              print(f"ledger unreadable: {exc!r}")
              raise SystemExit(0)

          try:
              df = read_runs("warehouse/run_log.parquet")
          except BaseException as exc:  # noqa: BLE001
              print(f"ledger unreadable: {exc!r}")
              raise SystemExit(0)

          if df.empty:
              print("ledger empty -- the run failed before it could record itself")
              raise SystemExit(0)

          row = df.iloc[-1]
          for col in df.columns:
              print(f"{col}: {row[col]}")
          print(f"recorded_runs: {len(df)}")
          PY
          echo "--- resolved data stack ---"
          cat artifacts/datastack.txt || echo "(inventory not captured)"

      - name: Second pipeline run — history must accumulate
        run: python orchestrate.py --mode fixture

      # Issue #49's acceptance case, proved against the real ledger rather
      # than a mock: a credential in the environment must not be able to
      # turn a run that was pinned to fixture into a live run.
      - name: Third run — a present credential must not override --mode fixture
        env:
          EVDS_API_KEY: dummy-value-that-must-never-be-used
        run: python orchestrate.py --mode fixture

      - name: Reject an unknown flag instead of ignoring it
        run: |
          set +e
          python orchestrate.py --mode prod
          code=$?
          set -e
          echo "exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "::error::orchestrate.py accepted an invalid --mode value"
            exit 1
          fi
          echo "invalid --mode is a hard error: OK"

      - name: Verify audit ledger with DuckDB
        run: |
          python - <<'PY'
          import glob
          import duckdb

          parts = sorted(glob.glob("warehouse/run_log_parts/*.parquet"))
          assert parts, "no per-run part files were written"
          print(f"part files: {len(parts)}")

          con = duckdb.connect()

          part_rows = con.execute(
              "select count(*), count(distinct run_id) "
              "from read_parquet('warehouse/run_log_parts/*.parquet')"
          ).fetchone()
          print(f"parts: {part_rows[0]} rows, {part_rows[1]} distinct run_id")
          assert part_rows[0] == part_rows[1], "a run_id appears in more than one part"
          assert part_rows[0] >= 3, "expected at least three recorded runs"

          snap_rows = con.execute(
              "select count(*) from 'warehouse/run_log.parquet'"
          ).fetchone()[0]
          print(f"derived snapshot: {snap_rows} rows")
          assert snap_rows == part_rows[0], (
              f"snapshot ({snap_rows}) disagrees with parts ({part_rows[0]})"
          )

          statuses = con.execute(
              "select status, count(*) from 'warehouse/run_log.parquet' "
              "group by status order by status"
          ).fetchall()
          print(f"status breakdown: {statuses}")
          assert any(s == "success" for s, _ in statuses), "no successful run recorded"

          # Every run in this job was pinned with --mode fixture, and one of
          # them ran with EVDS_API_KEY set. If the flag were still cosmetic,
          # that run would have recorded mode='live' and this would fail.
          modes = con.execute(
              "select mode, count(*) from 'warehouse/run_log.parquet' "
              "group by mode order by mode"
          ).fetchall()
          print(f"mode breakdown: {modes}")
          assert modes == [("fixture", part_rows[0])], (
              f"--mode fixture was not honoured by every run: {modes}"
          )

          sources = {r[0] for r in con.execute(
              "select distinct source_name from 'warehouse/run_log.parquet'"
          ).fetchall()}
          print(f"sources: {sorted(sources)}")
          assert sources == {"fixture:synthetic"}, (
              f"a pinned-fixture run recorded a non-fixture source: {sources}"
          )

          cols = {
              r[0]
              for r in con.execute(
                  "describe select * from 'warehouse/run_log.parquet'"
              ).fetchall()
          }
          required = {
              "run_id", "started_at_utc", "ended_at_utc", "duration_seconds",
              "status", "mode", "source_name", "bronze_rows", "gold_rows",
              "steps_total", "steps_failed", "git_sha", "failed_step",
          }
          missing = required - cols
          assert not missing, f"run log is missing columns: {sorted(missing)}"
          print("schema contract: OK")
          PY

      - name: Print run history
        run: |
          python - <<'PY'
          from observability import run_log
          print(run_log.summarize("warehouse/run_log.parquet", last=10))
          PY

      - name: Upload run audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-audit-evidence
          path: |
            warehouse/run_log.parquet
            warehouse/run_log_parts/
            artifacts/datastack.txt
          if-no-files-found: error
          retention-days: 30
