name: run-audit

# Verifies the M12 observability layer: the audit-log contract, that a real
# pipeline execution actually writes a row, and — via fault injection — that
# the audit layer never changes the pipeline's own exit code. Kept in its own
# workflow so it stays readable and can be dispatched on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (run audit log contract)
        run: python tests/test_run_log.py

      - name: End-to-end proof (two fixture runs append two distinct rows)
        run: |
          python orchestrate.py
          python orchestrate.py
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from observability.run_log import read_runs, summarize
          df = read_runs("warehouse/run_log.parquet")
          print(summarize("warehouse/run_log.parquet"))
          ok = (
              len(df) == 2
              and df["run_id"].nunique() == 2
              and (df["status"] == "success").all()
              and (df["gold_rows"].astype(int) > 0).all()
              and (df["mode"] == "fixture").all()
          )
          print("===== OTOMATIK KONTROL =====")
          print(f"run_rows: {len(df)}")
          print(f"unique_run_ids: {df['run_id'].nunique()}")
          print(f"statuses: {sorted(set(df['status']))}")
          print(f"gold_rows: {list(df['gold_rows'])}")
          print(f"RESULT: {'PASS' if ok else 'FAIL'}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Failure-path proof (fault injection)
        run: python tests/test_run_log_failure_paths.py

      - name: Independent read via DuckDB (not the writer's own reader)
        run: |
          python - <<'EOF'
          import duckdb
          rows = duckdb.connect().sql(
              "select status, count(*) from 'warehouse/run_log.parquet' "
              "group by 1 order by 1"
          ).fetchall()
          print("===== OTOMATIK KONTROL =====")
          print(f"duckdb_status_counts: {rows}")
          statuses = {r[0] for r in rows}
          ok = "success" in statuses and "failure" in statuses
          print(f"RESULT: {'PASS' if ok else 'FAIL'}")
          raise SystemExit(0 if ok else 1)
          EOF

      - name: Upload the audit log as durable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-parquet
          path: warehouse/run_log.parquet
          if-no-files-found: warn
