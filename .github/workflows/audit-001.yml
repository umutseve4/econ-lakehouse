name: audit-001-tufe-aritmetigi

# Bu is akisi, audits/001-tufe-aritmetigi/README.md icindeki HER sayiyi
# ham CSV'den yeniden hesaplar. Rapordaki bir sayi veriyle uyusmazsa
# kirmizi olur. Amac, raporun statik metin degil dogrulanan iddia olmasi.

on:
  push:
    branches: ["**"]
    paths:
      - "audits/001-tufe-aritmetigi/**"
      - "tests/test_audit_001.py"
      - ".github/workflows/audit-001.yml"
  pull_request:
    paths:
      - "audits/001-tufe-aritmetigi/**"
      - "tests/test_audit_001.py"
      - ".github/workflows/audit-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # on-kayit sira testi tam gecmis ister

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Denetimi kos ve beyanlari dogrula
        run: python audits/001-tufe-aritmetigi/audit.py --check

      - name: Kaynak dosyalari degismedigini dogrula
        run: |
          git diff --exit-code -- audits/001-tufe-aritmetigi/data/ \
            || { echo "HATA: denetim ham veriyi degistirdi"; exit 1; }

      # Ek A'daki 64 satirin tamami results.json'dan yeniden uretilir ve
      # commit edilmis dosyayla byte byte karsilastirilir. Rapordaki bir
      # satir elle degistirilirse burasi kirilir.
      - name: Ek A tablosunu yeniden uret ve karsilastir
        run: |
          python - <<'PY'
          import json, pathlib
          d = pathlib.Path("audits/001-tufe-aritmetigi")
          a = json.loads((d / "results.json").read_text())["katman_A"]
          L = ["# Ek A. Katman A tam artik tablosu", "",
               "Denetim 001, TUIK TUFE, Eylul 2020 - Aralik 2025, 64 ay.", "",
               "`endeksten` = (endeks[t]/endeks[t-1] - 1) * 100, yayimlanan 2003=100 endeks",
               "duzeylerinden turetilmistir. `artik` = endeksten - yayimlanan.",
               "Tolerans araligi her ay icin ayri hesaplanir, bkz. PROTOCOL.md bolum 2.", "",
               "| ay | yayimlanan % | endeksten % | artik pp | tolerans alt | tolerans ust | sonuc |",
               "|---|---|---|---|---|---|---|"]
          for s in a["satirlar"]:
              L.append("| %s | %s | %s | %s | %s | %s | %s |" % (
                  s["ay"], s["yayimlanan"], s["endeksten"], s["artik_pp"],
                  s["tolerans_alt"], s["tolerans_ust"],
                  "GECTI" if s["gecti"] else "KALDI"))
          L += ["", "**Toplam: 64 ayin 64'u kendi tolerans araliginda. Toleransi asan ay: 0.**",
                "", "En buyuk mutlak artik: %s pp. Ortalama: %s pp." % (
                    a["en_buyuk_artik"], a["ortalama_artik"]),
                "Tolerans yaricapi %s pp ile %s pp arasinda degisir." % (
                    a["tolerans_yaricap_min"], a["tolerans_yaricap_max"]),
                "", "Bu tablo `audit.py` tarafindan uretilir, elle yazilmaz."]
          pathlib.Path("/tmp/ek-a.md").write_text("\n".join(L) + "\n")
          PY
          diff -u audits/001-tufe-aritmetigi/EK-A-artik-tablosu.md /tmp/ek-a.md \
            || { echo "HATA: Ek A tablosu hesaplanan degerlerle ayrismis"; exit 1; }
          echo "Ek A'daki 64 satirin tamami yeniden uretildi ve birebir tuttu."

      # Raporda adi gecen en buyuk artik ayi, tablodan bagimsiz olarak
      # dogrulanir. Ilk yazimda burasi yanlisti (2021-05 yazilmisti).
      - name: En buyuk artigin ayini rapordan dogrula
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = pathlib.Path("audits/001-tufe-aritmetigi")
          a = json.loads((d / "results.json").read_text())["katman_A"]
          ay = max(a["satirlar"], key=lambda s: abs(float(s["artik_pp"])))["ay"]
          txt = (d / "README.md").read_text(encoding="utf-8")
          hedef = "%s pp (%s)" % (a["en_buyuk_artik"].replace(".", ","), ay)
          if hedef not in txt:
              sys.exit("HATA: README'de '%s' beklendi, bulunamadi" % hedef)
          print("README dogru ayi gosteriyor:", hedef)
          PY

      - name: pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_audit_001.py -v

      - name: On-kayit sirasini goster
        if: always()
        run: |
          echo "PROTOCOL.md ve sonuc dosyalarinin ilk commit sirasi:"
          git log --reverse --format='%h %ad %s' --date=iso \
            -- audits/001-tufe-aritmetigi/ | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-001-results
          path: audits/001-tufe-aritmetigi/results.json
