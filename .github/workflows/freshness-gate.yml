name: freshness-gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 6 * * 1"  # after the main Monday pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact event revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Freshness policy boundary tests (offline)
        run: python tests/test_freshness.py
      # The alert decision is JavaScript because it runs inside github-script.
      # It is tested here rather than in its own workflow so that the gate and
      # the alarm that reports on the gate cannot drift apart.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Failure-alert dedup decision tests (offline)
        run: node tests/test_alert_dedup.js

  live-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact event revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install live-gate runtime dependency
        run: python -m pip install "pandas>=2.2"
      - name: Require EVDS credential
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          if [ -z "$EVDS_API_KEY" ]; then
            echo "===== OTOMATIK KONTROL ====="
            echo "EVDS_API_KEY: MISSING"
            echo "RESULT: FAIL"
            exit 1
          fi
      - name: Fetch production CPI series
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python ingest/evds_client.py --series TP.FG.J0 --start 2015-01 --out data/evds/cpi_evds.csv
      # --series is what allows a documented, time-boxed acknowledgement to
      # apply. Without it the gate still runs, but no acknowledgement can ever
      # match — an omission fails closed rather than open.
      - name: Enforce maximum 3-month observation lag
        run: python ingest/freshness_gate.py --csv data/evds/cpi_evds.csv --max-lag-months 3 --series TP.FG.J0

  alert-on-live-failure:
    needs: [live-gate]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Needed so github-script can require the shared decision module. The
      # decision itself must not be re-typed inline here; that duplication is
      # exactly how the two alert jobs drifted into opposite bugs (#47).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { decideAlertAction } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/alert_dedup.js`);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Data freshness gate failed — TP.FG.J0';
            const marker = '<!-- freshness-gate:TP.FG.J0 -->';

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-freshness',
              per_page: 100,
            });

            // Dedupe on the stable marker so the issue can be retitled (for
            // example into an accepted-incident record) without spawning a
            // duplicate. The title match is a fallback for issues opened
            // before the marker existed. Both branches are proven offline in
            // tests/test_alert_dedup.js.
            const decision = decideAlertAction({ openIssues, marker, title });
            core.info(`dedup decision: ${decision.action} (matched by ${decision.matchedBy || 'nothing'})`);

            if (decision.action === 'create') {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['data-freshness'],
                body: `${marker}\nThe production CPI source exceeded the 3-month freshness limit.\n\nRun: ${runUrl}\n\nDo not silently substitute another series; verify its identity and YoY compatibility first.`,
              });
              core.notice(`opened incident #${created.data.number}`);
              return;
            }

            // Without this comment a recurring failure would be completely
            // silent: the issue is already open, so nothing is created and
            // nobody is notified. That is exactly the state the week an
            // acknowledgement expires.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: decision.issueNumber,
              body: `${marker}\nThe freshness gate failed again on \`${context.eventName}\`.\n\nRun: ${runUrl}\n\nIf a time-boxed acknowledgement was covering this series, it has expired or no longer matches (the upstream month moved, or the series changed). Re-run the investigation before touching \`ingest/freshness_waiver.py\` — extending a waiver without new evidence is how a gate becomes decoration.`,
            });
            core.notice(`commented on existing incident #${decision.issueNumber}`);
