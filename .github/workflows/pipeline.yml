name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly rehearsal run, Monday 06:17 UTC
  workflow_dispatch:

# Least privilege by default. Jobs that genuinely need more (writing PR
# comments, opening issues) opt in explicitly below, so an added job cannot
# silently inherit a write-scoped token.
permissions:
  contents: read

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # requirements.txt pins floors, not exact versions, so two clean
      # installs of the same commit can resolve different HTTP stacks. When
      # a live-fetch step fails, "was the resolved stack the same?" is the
      # first question worth asking, and it is unanswerable after the fact
      # unless the answer was recorded. Never gates CI.
      - name: Resolved HTTP stack inventory (diagnostic, never gates CI)
        continue-on-error: true
        run: |
          python -m pip list 2>&1 \
            | grep -Ei '^(fastapi|starlette|anyio|httpx|httpcore|requests|urllib3|uvicorn) ' \
            | tee /tmp/deps.txt

      - name: Unit tests (bronze contract)
        run: python tests/test_ingest.py

      - name: Unit tests (EVDS client, offline)
        run: python tests/test_evds_client.py

      - name: Unit tests (storage abstraction)
        run: python tests/test_storage.py

      # A single-attempt live HTTP call turns a momentary upstream blip into
      # a red main: this step failed here on a912a76e after 31s while its
      # parent passed the same call in 1s. Retry with backoff and print the
      # attempt count, so a retried success stays visible. Three consecutive
      # failures still fail the job -- a real, reproducible breakage is not
      # swallowed, and no partial SOURCE_* state is exported on failure.
      - name: Fetch real CPI from EVDS (only when secret configured)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          if [ -z "$EVDS_API_KEY" ]; then
            echo "EVDS_API_KEY secret not set — skipping live fetch, using synthetic fixture."
            echo "SOURCE_CSV=data/sample/cpi_fixture.csv" >> "$GITHUB_ENV"
            echo "SOURCE_NAME=fixture:synthetic" >> "$GITHUB_ENV"
          else
            for attempt in 1 2 3; do
              echo "evds_fetch_attempt: $attempt"
              if python ingest/evds_client.py --series TP.FG.J0 --start 2015-01 --out data/evds/cpi_evds.csv; then
                echo "SOURCE_CSV=data/evds/cpi_evds.csv" >> "$GITHUB_ENV"
                echo "SOURCE_NAME=evds:TP.FG.J0" >> "$GITHUB_ENV"
                echo "===== OTOMATIK KONTROL ====="
                echo "evds_fetch_attempts_used: $attempt"
                echo "RESULT: PASS"
                exit 0
              fi
              echo "evds fetch attempt $attempt failed"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            echo "===== OTOMATIK KONTROL ====="
            echo "evds_fetch_attempts_used: 3"
            echo "RESULT: FAIL (three consecutive EVDS fetch failures - not transient)"
            exit 1
          fi

      - name: EVDS freshness probe (diagnostic, never gates CI)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        continue-on-error: true
        run: |
          python ingest/evds_freshness.py 2>&1 | tee /tmp/freshness.txt

      - name: Ingest -> bronze (Parquet)
        run: python ingest/ingest.py --source "$SOURCE_CSV" --out warehouse/bronze --source-name "$SOURCE_NAME"

      - name: Idempotency proof (re-ingest must not change row count)
        run: |
          python - "$SOURCE_CSV" "$SOURCE_NAME" <<'EOF'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from ingest.ingest import count_bronze_rows
          src, name = sys.argv[1], sys.argv[2]
          before = count_bronze_rows(Path("warehouse/bronze"))
          subprocess.run(
              [sys.executable, "ingest/ingest.py", "--source", src,
               "--out", "warehouse/bronze", "--source-name", name],
              check=True,
          )
          after = count_bronze_rows(Path("warehouse/bronze"))
          print("===== OTOMATIK KONTROL =====")
          print(f"rows_before_reingest: {before}")
          print(f"rows_after_reingest:  {after}")
          print(f"RESULT: {'PASS' if before == after and before > 0 else 'FAIL'}")
          assert before == after and before > 0
          EOF

      - name: dbt build (silver + gold + data-quality tests)
        env:
          DBT_PROFILES_DIR: .
        run: dbt build --project-dir .

      - name: Show gold mart sample
        run: |
          python - <<'EOF'
          import duckdb
          con = duckdb.connect("warehouse/econ.duckdb")
          print(con.sql("select * from mart_inflation_yoy order by obs_date, item_code limit 12"))
          n = con.sql("select count(*) from mart_inflation_yoy").fetchone()[0]
          print("===== OTOMATIK KONTROL =====")
          print(f"gold_rows: {n}")
          print(f"RESULT: {'PASS' if n > 0 else 'FAIL'}")
          assert n > 0
          EOF

      - name: Gold freshness report (lag between newest obs and today)
        continue-on-error: true
        run: |
          python - <<'EOF' 2>&1 | tee /tmp/goldlag.txt
          import duckdb
          from datetime import date
          con = duckdb.connect("warehouse/econ.duckdb")
          newest = con.sql("select max(obs_date) from mart_inflation_yoy").fetchone()[0]
          today = date.today()
          lag = (today.year - newest.year) * 12 + (today.month - newest.month)
          print("===== OTOMATIK KONTROL =====")
          print(f"gold_newest_obs: {newest}")
          print(f"today: {today}")
          print(f"lag_months: {lag}")
          print(f"RESULT: {'PASS' if lag <= 3 else 'WARN (stale beyond 3 months)'}")
          EOF

      - name: Publish diagnostics back onto the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 55000); }
              catch (e) { return `(no output captured: ${p})`; }
            };
            const body = [
              '## M11 diagnostics (automated)',
              '',
              '### EVDS freshness probe',
              '```',
              read('/tmp/freshness.txt'),
              '```',
              '',
              '### Gold mart lag',
              '```',
              read('/tmp/goldlag.txt'),
              '```',
              '',
              '### Resolved HTTP stack',
              '```',
              read('/tmp/deps.txt'),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Snapshot test (late-revision history, SCD Type 2)
        env:
          DBT_PROFILES_DIR: .
        run: python tests/test_snapshot_revision.py

      - name: Unit tests (serving API, fixture warehouse)
        run: python tests/test_api.py

      - name: Serving API smoke against real warehouse
        run: |
          uvicorn serve.app:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          HEALTH=$(curl -sf http://localhost:8000/health)
          ROWS=$(curl -sf 'http://localhost:8000/v1/inflation?limit=3')
          LATEST=$(curl -sf 'http://localhost:8000/v1/inflation/latest')
          echo "health: $HEALTH"
          echo "sample: $ROWS"
          echo "===== OTOMATIK KONTROL ====="
          GOLD=$(echo "$HEALTH" | python -c "import sys,json;print(json.load(sys.stdin)['gold_rows'])")
          NLATEST=$(echo "$LATEST" | python -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "gold_rows_via_api: $GOLD"
          echo "latest_items: $NLATEST"
          if [ "$GOLD" -gt 0 ] && [ "$NLATEST" -gt 0 ]; then
            echo "RESULT: PASS"
          else
            echo "RESULT: FAIL"; exit 1
          fi

  dashboard-smoke:
    # Dashboard data layer unit tests + headless Streamlit AppTest render
    # over a fixture warehouse — proves the UI code path executes without
    # exceptions on a clean checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dashboard tests (data layer + AppTest, fixture warehouse)
        run: python tests/test_dashboard.py

      - name: Bootstrap unit tests (subprocess stubbed)
        run: python tests/test_bootstrap.py

      - name: Cold-start bootstrap e2e (fixture mode, real pipeline)
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path
          from dashboard.bootstrap import ensure_warehouse
          m = ensure_warehouse()
          prov = json.loads(Path("warehouse/provenance.json").read_text())
          print("===== OTOMATIK KONTROL =====")
          print("bootstrap_mode:", m)
          print("provenance_mode:", prov.get("mode"))
          print("provenance_source:", prov.get("source_name"))
          ok = m == "built-fixture" and prov.get("mode") == "fixture"
          print("RESULT:", "PASS" if ok else "FAIL")
          sys.exit(0 if ok else 1)
          EOF

  dagster-orchestration:
    # Materializes the full asset graph (bronze -> marts + checks) in-process
    # on a clean checkout, in deterministic fixture mode (no EVDS secret).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dagster DAG test (asset graph + in-process materialization)
        run: python tests/test_dag.py

  remote-storage:
    # Proves the bronze lake runs unchanged on S3-compatible object storage.
    # MinIO is throwaway (lives only for this job), so hardcoded creds here
    # are ephemeral test fixtures, not secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start MinIO (S3-compatible object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=lakeadmin \
            -e MINIO_ROOT_PASSWORD=lakesecret123 \
            quay.io/minio/minio server /data

      - name: Remote storage end-to-end test
        env:
          LAKE_S3_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: lakeadmin
          AWS_SECRET_ACCESS_KEY: lakesecret123
        run: python tests/test_remote_storage.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The docker.io pull behind `FROM python:3.12-slim` failed twice on
      # 2026-09-05 (runs 33961541818 and 33962425508) and then succeeded
      # unchanged on the very same commit (33963155770) — a transient
      # registry fault, not a defect in this repository. See #60. A
      # single-attempt build turns somebody else's outage into a red main.
      # Retry with backoff, and print the attempt count so a retried build
      # stays visible in the log instead of silently papering over a real,
      # reproducible breakage. Three consecutive failures still fail the job.
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            echo "build_attempt: $attempt"
            if docker build -t econ-lakehouse .; then
              echo "===== OTOMATIK KONTROL ====="
              echo "build_attempts_used: $attempt"
              echo "RESULT: PASS"
              exit 0
            fi
            echo "build attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "===== OTOMATIK KONTROL ====="
          echo "build_attempts_used: 3"
          echo "RESULT: FAIL (three consecutive build failures - not transient)"
          exit 1

      - name: Report image size
        run: |
          echo "===== OTOMATIK KONTROL ====="
          docker image inspect econ-lakehouse --format 'image_size_mb: {{.Size}}' \
            | awk -F': ' '{printf "image_size_mb: %.0f\n", $2/1024/1024}'

      - name: Run container end-to-end (live if secret set, else fixture)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          if [ -z "$EVDS_API_KEY" ]; then
            echo "run_mode: fixture (EVDS_API_KEY absent)"
            docker run --rm econ-lakehouse 2>&1 | tee /tmp/container.log
          else
            echo "run_mode: live (EVDS_API_KEY present)"
            docker run --rm -e EVDS_API_KEY econ-lakehouse 2>&1 | tee /tmp/container.log
          fi
          code=${PIPESTATUS[0]}
          echo "===== OTOMATIK KONTROL ====="
          echo "container_exit_code: $code"
          if [ "$code" -eq 0 ]; then
            echo "RESULT: PASS"
          else
            echo "RESULT: FAIL"
            echo "--- last 40 lines of container output ---"
            tail -n 40 /tmp/container.log
          fi
          exit "$code"

  alert-on-failure:
    # Opens a GitHub issue when a scheduled run fails, so silent breakage
    # (e.g. an upstream EVDS API change) surfaces without anyone watching CI.
    runs-on: ubuntu-latest
    needs: [ingest-and-transform, docker-smoke, remote-storage, dagster-orchestration, dashboard-smoke]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Scheduled pipeline failed';
            const marker = '<!-- pipeline-failure -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
              per_page: 100,
            });
            // The title used to embed the failure date, so every weekly
            // failure opened a brand new issue: the documented deduplication
            // never actually happened. Dedupe on a stable marker instead and
            // record a recurrence as a comment on the open issue, so an
            // unresolved breakage reads as one incident rather than a pile.
            const existing = open.find((issue) => (issue.body || '').includes(marker));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["pipeline-failure"],
                body: `${marker}\nThe weekly scheduled pipeline run failed.\n\nFirst failing run: ${runUrl}\n\nLikely causes: EVDS API change/outage, dbt test failure, or dependency drift.\n\nClose this issue only after a scheduled run has succeeded again. While it stays open, further failures are added here as comments instead of opening new issues.`,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `${marker}\nThe scheduled pipeline failed again.\n\nRun: ${runUrl}\n\nThis is a recurrence of an unresolved failure, not a new incident. If the cause has changed, say so here rather than opening a second issue.`,
            });
